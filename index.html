<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Percentage Calculator</title>
        <meta description="A simple percentage calculator.">
        <meta name="description" content="A simple percentage calculator.">
        <meta name="keywords" content="percentage, calculator, math, tool">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>Percentage Calculator</h1>
        <p>What is <input autofocus class="percent" type="text"
                inputmode="numeric" size="6" placeholder="percent" data-row="0">
            percent of <input class="whole" type="text" inputmode="numeric"
                size="12" placeholder="whole" data-row="0">&nbsp;?
        </p>
        <p>
            <span class="partResult">???</span>
        </p>
        <p>
            <input class="part" type="text" inputmode="numeric" size="12"
                placeholder="Part" data-row="1"> is what percent of <input
                class="whole" type="text" inputmode="numeric" size="12"
                placeholder="whole" data-row="1">&nbsp;?
        </p>
        <p>
            <span class="percentResult">???</span>%
        </p>
        <p>
            If <input class="part" type="text" inputmode="numeric" size="12"
                placeholder="part" data-row="2"> is <input class="percent"
                type="text" inputmode="numeric" size="6" placeholder="percent"
                data-row="2"> percent, what is
            100%&nbsp;?
        </p>
        <p>
            <span class="wholeResult">???</span>
        </p>
        <div class="formula">
            <div class="fraction">
                <span class="numerator">Part</span>
                <span class="denominator">Whole</span>
            </div>
            <div class="fraction">
                =
            </div>
            <div class="fraction">
                <span class="numerator numeratorPart">???</span>
                <span class="denominator denominatorWhole">???</span>
            </div>
            <div class="fraction">
                =
            </div>
            <div class="fraction">
                <span class="numerator numeratorPercent">???</span>
                <span class="denominator">100</span>
            </div>
            <div class="fraction">
                =
            </div>
            <div class="fraction">
                <span class="percentResult">Percent</span>%
            </div>
        </div>
        <script src="script.js"></script>
    </body>

</html>
