<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Percentage Calculator</title>
        <meta name="description" content="A simple percentage calculator.">
        <meta name="keywords" content="percentage, calculator, math, tool">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>Percentage Calculator</h1>
        <p>What is <label name="percent"><input autofocus class="percent"
                    type="text" inputmode="numeric" size="6"
                    placeholder="percent" data-row="0"></label>
            percent of <label name="whole"><input class="whole" type="text"
                    inputmode="numeric" size="12" placeholder="whole"
                    data-row="0"></label> ?
        </p>
        <p>
            <span class="partResult">???</span>
        </p>
        <p>
            <label name="part"><input class="part" type="text"
                    inputmode="numeric" size="12" placeholder="Part"
                    data-row="1"></label> is what percent of <label
                name="whole"><input class="whole" type="text"
                    inputmode="numeric" size="12" placeholder="whole"
                    data-row="1"></label> ?
        </p>
        <p>
            <span class="percentResult">???%</span>
        </p>
        <p>
            If <label name="part"><input class="part" type="text"
                    inputmode="numeric" size="12" placeholder="part"
                    data-row="2"></label> is <label name="percent"><input
                    class="percent" type="text" inputmode="numeric" size="6"
                    placeholder="percent" data-row="2"></label> percent, what is
            100% ?
        </p>
        <p>
            <span class="wholeResult">???</span>
        </p>
        <div class="formula">
            <div class="fraction">
                <span class="numerator">Part</span>
                <span class="denominator">Whole</span>
            </div>
            <div class="fraction">
                =
            </div>
            <div class="fraction">
                <span class="numerator numeratorPart">???</span>
                <span class="denominator denominatorWhole">???</span>
            </div>
            <div class="fraction">
                =
            </div>
            <div class="fraction">
                <span class="numerator numeratorPercent">???</span>
                <span class="denominator">100</span>
            </div>
            <div class="fraction">
                ►
            </div>
            <div class="fraction">
                <span class="percentResult">???%</span>
            </div>
        </div>
        <hr>
        <p>
            What is the percentage change
            <br>from
            <label name="oldValue"><input class="oldValue" type="text"
                    inputmode="numeric" size="12" placeholder="old value"
                    data-row="3"></label>
            to
            <label name="newValue"><input class="newValue" type="text"
                    inputmode="numeric" size="12" placeholder="new value"
                    data-row="3"></label>?
        </p>
        <div>
            <span class="percentageChangeResult">???%</span>
        </div>
        <div class="formula">
            <div class="fraction">
                <span class="numerator">New - Old</span>
                <span class="denominator">|Old|</span>
            </div>
            <div class="fraction">
                =
            </div>
            <div class="fraction">
                <span class="numerator numeratorChange">??? - ???</span>
                <span class="denominator denominatorOld">|???|</span>
            </div>
            <div class="fraction">
                =
            </div>
            <div class="fraction">
                <span class="numerator numeratorPercentChange">???</span>
                <span class="denominator">100</span>
            </div>
            <div class="fraction">
                ►
            </div>
            <div class="fraction">
                <span class="percentageChangeResult">???%</span>
            </div>
        </div>
        <script src="script.js"></script>
    </body>

</html>
